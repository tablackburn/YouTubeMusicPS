name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: PSScriptAnalyzer Lint
    runs-on: ubuntu-latest
    # Guard against a hung step burning the 6-hour default. Lint normally
    # finishes in well under a minute, cold cache included.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Cache only the CurrentUser module paths -- the same Target build.depend.psd1
      # installs to. Keyed on the dependency file so a version bump busts the cache.
      - name: Cache PowerShell modules
        uses: actions/cache@v6
        with:
          path: |
            ~/Documents/PowerShell/Modules
            ~/.local/share/powershell/Modules
          key: ${{ runner.os }}-psmodules-lint-${{ hashFiles('build.depend.psd1') }}
          restore-keys: |
            ${{ runner.os }}-psmodules-lint-

      - name: Install dependencies
        shell: pwsh
        run: ./build.ps1 -Bootstrap -Task Init

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: ./build.ps1 -Task Analyze

  test:
    name: Unit Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Guard against a hung step burning the 6-hour default. A cold run --
    # installing every dependency from the gallery -- completes in about
    # 90 seconds; a warm one in under 60. Windows jobs on refs/heads/main
    # have been observed hanging indefinitely in 'Build and Test' with no
    # output at all, which this turns into a fast, visible failure.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Cache only the CurrentUser module paths -- the same Target build.depend.psd1
      # installs to. Keyed on the dependency file so a version bump busts the cache.
      - name: Cache PowerShell modules
        uses: actions/cache@v6
        with:
          path: |
            ~/Documents/PowerShell/Modules
            ~/.local/share/powershell/Modules
          key: ${{ runner.os }}-psmodules-${{ hashFiles('build.depend.psd1') }}
          restore-keys: |
            ${{ runner.os }}-psmodules-

      - name: Run tests
        shell: pwsh
        run: ./build.ps1 -Bootstrap -Task Test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: out/testResults.xml
          retention-days: 30

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v7
        with:
          files: out/codeCoverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
